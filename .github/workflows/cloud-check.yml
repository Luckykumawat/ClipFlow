name: Cloud container verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build free cloud profile with cached models
        run: docker build -f Dockerfile.cloud -t clipflow:test .
      - name: Run with 512 MB RAM
        run: docker run -d --name clipflow --memory=512m --memory-swap=512m --cpus=1 -p 8765:8765 -e PUBLIC_ACCESS=0 -e APP_USER=clipflow -e APP_PASSWORD=ci-only-disposable-password123 clipflow:test
      - name: Wait for health
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8765/healthz; then exit 0; fi
            sleep 2
          done
          docker logs clipflow
          exit 1
      - name: Verify full AI workflow
        env:
          APP_PASSWORD: ci-only-disposable-password123
        run: |
          docker cp tests/cloud_smoke.py clipflow:/app/cloud_smoke.py
          docker exec -e APP_PASSWORD=ci-only-disposable-password123 clipflow python /app/cloud_smoke.py
          docker cp tests/long_video.py clipflow:/app/long_video.py
          docker exec clipflow python /app/long_video.py
          docker cp tests/large_upload.py clipflow:/app/large_upload.py
          docker exec clipflow python /app/large_upload.py
          docker cp tests/storage_management.py clipflow:/app/storage_management.py
          docker exec clipflow python /app/storage_management.py
          docker cp tests/public_sessions.py clipflow:/app/public_sessions.py
          docker exec -e PUBLIC_ACCESS=1 clipflow python /app/public_sessions.py
      - name: Container diagnostics
        if: always()
        run: |
          docker logs --tail 100 clipflow || true
          docker inspect --format '{{json .State}}' clipflow || true
          docker stats --no-stream clipflow || true
